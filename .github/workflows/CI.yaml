name: Code quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and format checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Check backend lint and formatting
        working-directory: api
        run: |
          python -m pip install -r requirements.txt
          ruff check .
          ruff format --check .
          python -m unittest discover -s tests

      - name: Check frontend lint
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Lint chart
        run: helm lint charts

      - name: Render chart templates
        run: helm template openlookup charts

  security-scan:
    name: Scan dependencies, secrets, and configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  build-images:
    name: Build and publish ARM64 images
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set image names and tag
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${OWNER}/openlookup" >> "$GITHUB_ENV"
          echo "TAG=main-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./api
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}-backend:${{ env.TAG }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./web
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}-frontend:${{ env.TAG }}

      - name: Update chart image tags
        run: |
          sed -i -E "s|(tag: ).*|\\1${TAG}|" charts/values.yaml
          if git diff --quiet -- charts/values.yaml; then
            echo "Chart image tags are already current"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add charts/values.yaml
          git commit -m "deploy: ${TAG}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
