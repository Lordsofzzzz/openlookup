{{- if .Values.cloudflared.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openlookup-cloudflared
  labels:
    app: openlookup-cloudflared
spec:
  replicas: {{ .Values.cloudflared.replicas }}
  selector:
    matchLabels:
      app: openlookup-cloudflared
  template:
    metadata:
      labels:
        app: openlookup-cloudflared
    spec:
      containers:
        - name: cloudflared
          image: {{ .Values.cloudflared.image | quote }}
          resources:
            {{- toYaml .Values.cloudflared.resources | nindent 12 }}
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudflared.tokenSecret }}
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
{{- end }}
