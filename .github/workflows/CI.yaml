name: Code quality

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and format checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Check backend lint and formatting
        working-directory: api
        run: |
          python -m pip install -r requirements.txt
          ruff check .
          ruff format --check .

      - name: Check frontend lint
        working-directory: web
        run: |
          npm ci
          npm run lint

  build-images:
    name: Build and publish ARM64 images
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set image names and tag
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${OWNER}/openlookup" >> "$GITHUB_ENV"
          echo "TAG=main-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./api
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}-backend:${{ env.TAG }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./web
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}-frontend:${{ env.TAG }}
