name: Code quality

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and format checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Check backend lint and formatting
        working-directory: api
        run: |
          python -m pip install -r requirements.txt
          ruff check .
          ruff format --check .

      - name: Check frontend lint
        working-directory: web
        run: |
          npm ci
          npm run lint
